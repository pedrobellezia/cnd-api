services:
  db:
    container_name: cnd-postgres
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data_new:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    container_name: cnd-migration
    image: cnd-api:latest
    build: .
    command: npx prisma migrate deploy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  api:
    container_name: cnd-api
    image: cnd-api:latest
    build: .
    command: node dist/index.js
    ports:
      - "${PORT}:${PORT}"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NODE_ENV: production
    volumes:
      - ./public:/app/public
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data_new:
